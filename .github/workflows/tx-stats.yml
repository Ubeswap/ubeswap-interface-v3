name: "Tx stats"
# Hourly: counts Ubeswap transactions on Celo and publishes stats.json on the orphan branch tx-stats-data,
# which the /stats page reads from raw.githubusercontent.com.
# Scheduled workflows only run from the default branch, so this starts once it is on main.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tx-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch previous stats
        run: |
          if git fetch -q --depth 1 origin tx-stats-data; then
            git show FETCH_HEAD:stats.json > "$RUNNER_TEMP/stats.json"
          else
            echo "no tx-stats-data branch yet, starting empty"
          fi

      - name: Collect
        run: node .github/scripts/tx-stats.mjs "$RUNNER_TEMP/stats.json"

      - name: Publish
        run: |
          git checkout -q --orphan tx-stats-data
          git rm -rq --cached .
          cp "$RUNNER_TEMP/stats.json" stats.json
          git add stats.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update tx stats"
          # one commit only, so the branch never grows history
          git push -q --force origin HEAD:tx-stats-data
